<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Cloth Fold Gradient 1 -->
    <linearGradient id="foldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Flowing Textile Fabric Swatches in Background -->
  <g filter="url(#shadow)">
    <!-- Cloth Layer 1 (Back drape - Gold) -->
    <path d="M120 180 C 180 140, 320 140, 390 190 C 400 240, 380 320, 360 360 C 290 320, 180 330, 120 280 Z" 
          fill="url(#goldGrad)" opacity="0.35"/>
          
    <!-- Cloth Layer 2 (Diagonal Fabric Roll / Cut Piece drape) -->
    <path d="M100 350 C 140 260, 200 170, 290 140 C 370 110, 420 160, 400 240 C 340 290, 240 370, 150 390 C 120 400, 90 380, 100 350 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Central Emblem: Stylized Monogram "K" + Textile Spool -->
  <g filter="url(#shadow)">
    <!-- Vertical Pillar of K with woven cut-piece notches -->
    <rect x="140" y="120" width="56" height="272" rx="28" fill="url(#foldGrad1)"/>
    <circle cx="168" cy="148" r="12" fill="#16a34a"/>
    <circle cx="168" cy="364" r="12" fill="#16a34a"/>

    <!-- Upper Arm of K (Folded Cloth Rib) -->
    <path d="M 230 250 L 330 140 C 344 125, 368 125, 382 140 C 396 155, 396 180, 380 195 L 285 295 Z" 
          fill="url(#foldGrad1)"/>
    <!-- Upper Arm Gold Ribbon Accent -->
    <path d="M 330 140 L 382 140 C 396 155, 396 180, 380 195 L 340 180 Z" 
          fill="url(#goldGrad)"/>

    <!-- Lower Arm of K (Draped Silk Cut Piece) -->
    <path d="M 240 240 L 350 360 C 365 376, 389 376, 402 360 C 416 345, 416 322, 398 306 L 295 200 Z" 
          fill="url(#foldGrad1)"/>
    <!-- Lower Arm Gold Ribbon Accent -->
    <path d="M 350 360 L 402 360 C 416 345, 416 322, 398 306 L 365 325 Z" 
          fill="url(#goldGrad)"/>

    <!-- Center Weave Gem Connector -->
    <circle cx="236" cy="256" r="24" fill="url(#goldGrad)" filter="url(#innerGlow)"/>
    <circle cx="236" cy="256" r="12" fill="#ffffff"/>
  </g>

  <!-- Sewing Needle & Thread Loop Accent -->
  <path d="M 120 400 Q 256 460 392 400" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="120" cy="400" r="5" fill="#fef08a"/>
  <circle cx="392" cy="400" r="5" fill="#fef08a"/>
</svg>

